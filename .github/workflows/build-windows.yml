name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pytest pywebview

      # --- QUALITY GATE ---
      - name: Run Pytest suite
        run: |
          pytest

      # --- PYINSTALLER BUILDS ---
      # 1. Directory build for Inno Setup (creates dist/StardewAnalyser/StardewAnalyser.exe)
      - name: Build directory executable for Inno Setup
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "StardewAnalyser" --add-data "data;data" --add-data "static;static" --add-data "templates;templates" --add-data "src;src" app_desktop.py

      # 2. Portable single-file executable (creates dist/StardewAnalyser-Portable.exe)
      - name: Build portable executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "StardewAnalyser-Portable" --add-data "data;data" --add-data "static;static" --add-data "templates;templates" --add-data "src;src" app_desktop.py

      # --- INNO SETUP COMPILATION ---
      - name: Compile Inno Setup installer
        uses: joncloud/innosetup-action@v1
        with:
          filepath: setup.iss

      # --- GITHUB RELEASE ---
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StardewAnalyser-Portable.exe
            StardewAnalyser-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
