services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stardew-watcher
    restart: unless-stopped
    environment:
      - SAVES_DIR=/saves
      - OUTPUT_FILE=/app/web/index.html
      - TEMPLATES_DIR=/app/templates
      - DEBOUNCE_SECONDS=2.0
    volumes:
      # Mount the local saves directory (read-only for security)
      # You can point this to your actual Stardew Valley save folder:
      # e.g., Windows: %APPDATA%/StardewValley/Saves
      #       Linux: ~/.config/StardewValley/Saves
      - ${SAVES_PATH:-./Saves}:/saves:ro
      # Mount shared web directory where the dashboard HTML is output
      - ./web:/app/web
      # Persist local object ID cache between container runs
      - ./data:/app/data

  web:
    image: nginx:alpine
    container_name: stardew-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Serve static HTML dashboard generated by watcher
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - watcher
