services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stardew-watcher
    restart: unless-stopped
    environment:
      - SAVES_DIR=/saves
      - OUTPUT_FILE=/app/web/index.html
      - TEMPLATES_DIR=/app/templates
      - DEBOUNCE_SECONDS=2.0
    volumes:
      # Mount saves directory (read-only) for new savegames
      - /srv/docker/data/sv-analyzer/saves:/saves:ro
      # Mount shared web directory where dashboard HTML is output
      - /srv/docker/data/sv-analyzer/web:/app/web

  web:
    image: nginx:alpine
    container_name: stardew-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Serve static HTML dashboard generated by watcher
      - /srv/docker/data/sv-analyzer/web:/usr/share/nginx/html:ro
    depends_on:
      - watcher

